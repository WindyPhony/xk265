<text x="328" y="1297" class="small" text-anchor="start">D</text>
<text x="540" y="1297" class="small" text-anchor="start">Q</text>
<polyline class="wire" points="560,1305 660,1305"/>
<polyline class="wire" points="600,1305 600,1228 155,1228 155,1331 190,1331"/>
<circle cx="600" cy="1305" r="3" fill="#444"/>
<text x="320" y="1450" class="small" text-anchor="start">256-bit output lane (no extra register)</text>
<text x="780" y="1262" class="" text-anchor="start">md_data_i[255:0]</text>
<polyline class="wire" points="780,1279 930,1279"/>
<polygon class="shape" points="930,1245 988,1270 988,1340 930,1365"/>
<text x="945" y="1284" class="small" text-anchor="start">1</text>
<text x="945" y="1335" class="small" text-anchor="start">0</text>
<polyline class="wire" points="959,1352.5 959,1405"/>
<text x="959" y="1425" class="small" text-anchor="middle">cnt == 10</text>
<polyline class="wire" points="988,1305 1060,1305"/>
<path class="shape" d="M1060,1268 A120.0,12 0 0 1 1300,1268 L1300,1342 A120.0,12 0 0 1 1060,1342 Z"/>
<ellipse class="shape" cx="1180.0" cy="1268" rx="120.0" ry="12"/>
<text x="1180.0" y="1307" class="" text-anchor="middle">rf_512bit[255:0]</text>
<text x="1180.0" y="1329" class="small" text-anchor="middle">DFF · reset = 0</text>
<text x="1068" y="1297" class="small" text-anchor="start">D</text>
<text x="1280" y="1297" class="small" text-anchor="start">Q</text>
<polyline class="wire" points="1300,1305 1400,1305"/>
<polyline class="wire" points="1340,1305 1340,1228 895,1228 895,1331 930,1331"/>
<circle cx="1340" cy="1305" r="3" fill="#444"/>
<text x="1060" y="1450" class="small" text-anchor="start">256-bit output lane (no extra register)</text>
<text x="35" y="1500" class="" text-anchor="start">Capture is not gated by enable or finish. rdata = md_data_i is a wire alias. Both lanes together form rf_512bit[511:0].</text>
</svg>