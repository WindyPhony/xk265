<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1520" viewBox="0 0 1520 1520">
<rect width="1520" height="1520" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#222;font-size:16px}.wire{fill:none;stroke:#444;stroke-width:1.6;stroke-linejoin:round}.shape{fill:white;stroke:#444;stroke-width:1.6}.title{font-size:24px;font-weight:bold}.section{font-size:19px;font-weight:bold}.small{font-size:14px}</style>
<text x="35" y="38" class="title" text-anchor="start">fetch8x8 — register / mux microarchitecture</text>
<text x="35" y="68" class="" text-anchor="start">All DFFs: rising-edge clk · asynchronous active-low rstn · reset value 0. Conditions use pre-edge register values.</text>
<text x="35" y="93" class="" text-anchor="start">MUX: long left edge = data inputs; short right edge = output; lower pin = select. Cylinders denote DFF storage.</text>
<line x1="30" y1="115" x2="1490" y2="115" stroke="#ddd"/>
<text x="35" y="144" class="section" text-anchor="start">1. Cycle counter — cnt[5:0]</text>
<rect class="shape" x="130" y="187" width="130" height="44"/>
<text x="195.0" y="214.0" class="" text-anchor="middle">+ 1 (6-bit)</text>
<polyline class="wire" points="260,209 350,209"/>
<polygon class="shape" points="350,175 408,200 408,270 350,295"/>
<text x="365" y="214" class="small" text-anchor="start">1</text>
<text x="365" y="265" class="small" text-anchor="start">0</text>
<polyline class="wire" points="379,282.5 379,335"/>
<text x="379" y="355" class="small" text-anchor="middle">enable</text>
<polygon class="shape" points="680,175 738,200 738,270 680,295"/>
<text x="695" y="214" class="small" text-anchor="start">1</text>
<text x="695" y="265" class="small" text-anchor="start">0</text>
<polyline class="wire" points="709,282.5 709,335"/>
<text x="709" y="355" class="small" text-anchor="middle">(cnt == 40) OR finish</text>
<polyline class="wire" points="408,235 580,235 580,261 680,261"/>
<text x="600" y="199" class="" text-anchor="start">6&#x27;d0</text>
<polyline class="wire" points="600,209 680,209"/>
<polyline class="wire" points="738,235 920,235"/>
<path class="shape" d="M920,198 A115.0,12 0 0 1 1150,198 L1150,272 A115.0,12 0 0 1 920,272 Z"/>
<ellipse class="shape" cx="1035.0" cy="198" rx="115.0" ry="12"/>
<text x="1035.0" y="237" class="" text-anchor="middle">cnt[5:0]</text>
<text x="1035.0" y="259" class="small" text-anchor="middle">DFF · reset = 0</text>
<text x="928" y="227" class="small" text-anchor="start">D</text>
<text x="1130" y="227" class="small" text-anchor="start">Q</text>
<polyline class="wire" points="1150,235 1400,235"/>
<text x="1250" y="223" class="" text-anchor="start">cnt[5:0]</text>
<polyline class="wire" points="1200,235 1200,165 70,165 70,261 350,261"/>
<polyline class="wire" points="70,209 130,209"/>
<circle cx="70" cy="209" r="3" fill="#444"/>
<circle cx="1200" cy="235" r="3" fill="#444"/>
<line x1="30" y1="380" x2="1490" y2="380" stroke="#ddd"/>
<text x="35" y="409" class="section" text-anchor="start">2. Block counter and address wiring</text>
<polygon class="shape" points="350,440 408,465 408,535 350,560"/>
<text x="365" y="479" class="small" text-anchor="start">1</text>
<text x="365" y="530" class="small" text-anchor="start">0</text>
<polyline class="wire" points="379,547.5 379,600"/>
<text x="379" y="620" class="small" text-anchor="middle">finish</text>
<polygon class="shape" points="680,440 738,465 738,535 680,560"/>
<text x="695" y="479" class="small" text-anchor="start">1</text>
<text x="695" y="530" class="small" text-anchor="start">0</text>
<polyline class="wire" points="709,547.5 709,600"/>
<text x="709" y="620" class="small" text-anchor="middle">enable AND (cnt == 32)</text>
<text x="240" y="464" class="" text-anchor="start">7&#x27;d0</text>
<polyline class="wire" points="240,474 350,474"/>
<polyline class="wire" points="408,500 580,500 580,526 680,526"/>
<rect class="shape" x="485" y="452" width="130" height="44"/>
<text x="550.0" y="479.0" class="" text-anchor="middle">+ 1 (7-bit)</text>
<polyline class="wire" points="615,474 680,474"/>
<polyline class="wire" points="738,500 920,500"/>
<path class="shape" d="M920,463 A115.0,12 0 0 1 1150,463 L1150,537 A115.0,12 0 0 1 920,537 Z"/>
<ellipse class="shape" cx="1035.0" cy="463" rx="115.0" ry="12"/>
<text x="1035.0" y="502" class="" text-anchor="middle">blockcnt[6:0]</text>
<text x="1035.0" y="524" class="small" text-anchor="middle">DFF · reset = 0</text>
<text x="928" y="492" class="small" text-anchor="start">D</text>
<text x="1130" y="492" class="small" text-anchor="start">Q</text>
<polyline class="wire" points="1150,500 1400,500"/>
<text x="1215" y="488" class="" text-anchor="start">blockcnt[6:0]</text>
<polyline class="wire" points="1200,500 1200,430 180,430 180,526 350,526"/>
<polyline class="wire" points="450,430 450,474 485,474"/>
<circle cx="450" cy="430" r="3" fill="#444"/>
<circle cx="1200" cy="500" r="3" fill="#444"/>
<text x="40" y="645" class="" text-anchor="start">md_4x4_x_o[3:0] = {blockcnt[4], blockcnt[2], blockcnt[0], 1&#x27;b0}</text>
<text x="40" y="670" class="" text-anchor="start">md_4x4_y_o[3:0] = {blockcnt[5], blockcnt[3], blockcnt[1], 1&#x27;b0}     (combinational wiring; bit 6 unused)</text>
<line x1="30" y1="700" x2="1490" y2="700" stroke="#ddd"/>
<text x="35" y="729" class="section" text-anchor="start">3. Registered read enable — md_ren_o</text>
<polygon class="shape" points="350,760 408,785 408,855 350,880"/>
<text x="365" y="799" class="small" text-anchor="start">1</text>
<text x="365" y="850" class="small" text-anchor="start">0</text>
<polyline class="wire" points="379,867.5 379,920"/>
<text x="379" y="940" class="small" text-anchor="middle">cnt == 17</text>
<polygon class="shape" points="680,760 738,785 738,855 680,880"/>
<text x="695" y="799" class="small" text-anchor="start">1</text>
<text x="695" y="850" class="small" text-anchor="start">0</text>
<polyline class="wire" points="709,867.5 709,920"/>
<text x="709" y="940" class="small" text-anchor="middle">(cnt == 0) AND enable</text>
<text x="240" y="784" class="" text-anchor="start">1&#x27;b0</text>
<polyline class="wire" points="240,794 350,794"/>
<text x="580" y="784" class="" text-anchor="start">1&#x27;b1</text>
<polyline class="wire" points="580,794 680,794"/>
<polyline class="wire" points="408,820 580,820 580,846 680,846"/>
<polyline class="wire" points="738,820 920,820"/>
<path class="shape" d="M920,783 A115.0,12 0 0 1 1150,783 L1150,857 A115.0,12 0 0 1 920,857 Z"/>
<ellipse class="shape" cx="1035.0" cy="783" rx="115.0" ry="12"/>
<text x="1035.0" y="822" class="" text-anchor="middle">md_ren_o</text>
<text x="1035.0" y="844" class="small" text-anchor="middle">DFF · reset = 0</text>
<text x="928" y="812" class="small" text-anchor="start">D</text>
<text x="1130" y="812" class="small" text-anchor="start">Q</text>
<polyline class="wire" points="1150,820 1400,820"/>
<text x="1250" y="808" class="" text-anchor="start">md_ren_o</text>
<polyline class="wire" points="1200,820 1200,750 180,750 180,846 350,846"/>
<circle cx="1200" cy="820" r="3" fill="#444"/>
<line x1="30" y1="960" x2="1490" y2="960" stroke="#ddd"/>
<text x="35" y="989" class="section" text-anchor="start">4. Registered index bit and fixed outputs</text>
<text x="100" y="1043" class="" text-anchor="start">cnt[3]</text>
<polyline class="wire" points="100,1055 350,1055"/>
<path class="shape" d="M350,1018 A95.0,12 0 0 1 540,1018 L540,1092 A95.0,12 0 0 1 350,1092 Z"/>
<ellipse class="shape" cx="445.0" cy="1018" rx="95.0" ry="12"/>
<text x="445.0" y="1057" class="" text-anchor="middle">flag</text>
<text x="445.0" y="1079" class="small" text-anchor="middle">DFF · reset = 0</text>
<text x="358" y="1047" class="small" text-anchor="start">D</text>
<text x="520" y="1047" class="small" text-anchor="start">Q</text>
<polyline class="wire" points="540,1055 660,1055"/>
<rect class="shape" x="660" y="1025" width="260" height="60"/>
<text x="790.0" y="1060.0" class="" text-anchor="middle">{2&#x27;b00, flag, 2&#x27;b00}</text>
<polyline class="wire" points="920,1055 1120,1055"/>
<text x="1130" y="1060" class="" text-anchor="start">md_idx_o[4:0]</text>
<text x="100" y="1125" class="" text-anchor="start">md_sel_o = 1&#x27;b0       md_size_o[1:0] = 2&#x27;b01       (constant wiring)</text>
<line x1="30" y1="1155" x2="1490" y2="1155" stroke="#ddd"/>
<text x="35" y="1184" class="section" text-anchor="start">5. Pixel capture — two independently held 256-bit lanes</text>
<text x="40" y="1262" class="" text-anchor="start">md_data_i[255:0]</text>
<polyline class="wire" points="40,1279 190,1279"/>
<polygon class="shape" points="190,1245 248,1270 248,1340 190,1365"/>
<text x="205" y="1284" class="small" text-anchor="start">1</text>
<text x="205" y="1335" class="small" text-anchor="start">0</text>
<polyline class="wire" points="219,1352.5 219,1405"/>
<text x="219" y="1425" class="small" text-anchor="middle">cnt == 2</text>
<polyline class="wire" points="248,1305 320,1305"/>
<path class="shape" d="M320,1268 A120.0,12 0 0 1 560,1268 L560,1342 A120.0,12 0 0 1 320,1342 Z"/>
