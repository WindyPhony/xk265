<text x="35" y="75" font-size="16" style="font-size:16px" text-anchor="start">Source: shared blockcnt[6:0] register output</text>
<rect class="s" x="480" y="100" width="195" height="270"/>
<text x="577.5" y="84" font-size="18" style="font-size:18px" text-anchor="middle">Concatenate</text>
<text x="577.5" y="401" font-size="18" style="font-size:18px" text-anchor="middle">wiring only</text>
<text x="90" y="121" font-size="18" style="font-size:18px" text-anchor="start">blockcnt[4]</text>
<polyline class="w" points="90,135 480,135"/>
<text x="491" y="127" font-size="15" style="font-size:15px" text-anchor="start">output bit 3</text>
<text x="90" y="186" font-size="18" style="font-size:18px" text-anchor="start">blockcnt[2]</text>
<polyline class="w" points="90,200 480,200"/>
<text x="491" y="192" font-size="15" style="font-size:15px" text-anchor="start">output bit 2</text>
