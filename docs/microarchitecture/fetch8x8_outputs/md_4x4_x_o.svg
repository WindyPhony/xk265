<polyline class="w" points="90,265 480,265"/>
<text x="491" y="257" font-size="15" style="font-size:15px" text-anchor="start">output bit 1</text>
<text x="90" y="316" font-size="18" style="font-size:18px" text-anchor="start">1&#x27;b0</text>
