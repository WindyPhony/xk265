<text x="720" y="218" font-size="18" style="font-size:18px" text-anchor="start">md_4x4_x_o[3:0]</text>
<text x="30" y="445" font-size="15" style="font-size:15px" text-anchor="start">No additional storage. The selected blockcnt bits connect directly to output bits [3:1]; bit 0 is zero.</text>
